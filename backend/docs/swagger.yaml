basePath: /api
definitions:
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminBlockDateRequest:
    properties:
      reason:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminBlockDateResponse:
    properties:
      blocked:
        type: boolean
      blockedAt:
        type: string
      date:
        type: string
      reason:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminBlockSlotRequest:
    properties:
      reason:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminBlockSlotResponse:
    properties:
      blocked:
        type: boolean
      blockedAt:
        type: string
      date:
        type: string
      reason:
        type: string
      routeName:
        type: string
      time:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminBookingListEntry:
    properties:
      createdAt:
        type: string
      effectiveAmount:
        type: number
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
      phone:
        type: string
      posterIncomingOrderId:
        type: integer
      posterIncomingTransactionId:
        type: integer
      quantities:
        $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.Quantities'
      routeName:
        type: string
      status:
        type: string
      totalAmount:
        type: number
      userEmail:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminCancelBookingRequest:
    properties:
      reason:
        minLength: 1
        type: string
    required:
    - reason
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminCancelBookingResponse:
    properties:
      bookingId:
        type: string
      cancelledAt:
        type: string
      reason:
        type: string
      status:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminPriceOverrideRequest:
    properties:
      reason:
        minLength: 5
        type: string
      totalAmount:
        description: nil clears the override
        type: number
    required:
    - reason
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminPriceOverrideResponse:
    properties:
      bookingId:
        type: string
      effectiveAmount:
        type: number
      overrideReason:
        type: string
      priceOverride:
        type: number
      totalAmount:
        type: number
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminSetBookingsEnabledRequest:
    properties:
      enabled:
        type: boolean
      reason:
        type: string
    required:
    - enabled
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminSetBookingsEnabledResponse:
    properties:
      bookingsEnabled:
        type: boolean
      reason:
        type: string
      updatedAt:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminSlotBookingsResponse:
    properties:
      bookings:
        items:
          $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminBookingListEntry'
        type: array
      date:
        type: string
      routeName:
        type: string
      time:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminUnblockDateResponse:
    properties:
      blocked:
        type: boolean
      date:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminUnblockSlotResponse:
    properties:
      blocked:
        type: boolean
      date:
        type: string
      routeName:
        type: string
      time:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminUpsertSlotRequest:
    properties:
      capacityBig:
        minimum: 0
        type: integer
      capacityMedium:
        minimum: 0
        type: integer
      capacitySmall:
        minimum: 0
        type: integer
    required:
    - capacityBig
    - capacityMedium
    - capacitySmall
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AdminUpsertSlotResponse:
    properties:
      blocked:
        type: boolean
      capacityBig:
        type: integer
      capacityMedium:
        type: integer
      capacitySmall:
        type: integer
      created:
        type: boolean
      date:
        type: string
      routeName:
        type: string
      time:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AvailabilityDay:
    properties:
      availableSlots:
        type: integer
      blocked:
        type: boolean
      date:
        type: string
      fullyBlocked:
        type: boolean
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.AvailabilityMonthResponse:
    properties:
      days:
        items:
          $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AvailabilityDay'
        type: array
      month:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.BookingBySessionResponse:
    properties:
      booking:
        $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.BookingPublicView'
      status:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.BookingPublicView:
    properties:
      contact:
        $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.ContactPublicView'
      date:
        type: string
      id:
        type: string
      quantities:
        $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.Quantities'
      routeName:
        type: string
      status:
        type: string
      time:
        type: string
      totalAmount:
        type: number
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.BookingStatusResponse:
    properties:
      bookingsEnabled:
        type: boolean
      reason:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.ContactPublicView:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.ContactRequest:
    properties:
      email:
        description: ignored; JWT email used
        type: string
      firstName:
        maxLength: 50
        minLength: 1
        type: string
      lastName:
        maxLength: 50
        minLength: 1
        type: string
      phone:
        description: REQUIRED
        type: string
    required:
    - firstName
    - lastName
    - phone
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.CreateBookingRequest:
    properties:
      contact:
        $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.ContactRequest'
      date:
        type: string
      quantities:
        $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.QuantitiesRequest'
      routeName:
        type: string
      time:
        type: string
    required:
    - contact
    - date
    - quantities
    - routeName
    - time
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.CreateBookingResponse:
    properties:
      bookingId:
        type: string
      expiresAt:
        type: string
      totalAmount:
        type: number
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.CreateCheckoutRequest:
    properties:
      bookingId:
        type: string
      resultUrl:
        type: string
    required:
    - bookingId
    - resultUrl
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.CreateCheckoutResponse:
    properties:
      checkoutUrl:
        type: string
      sessionId:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.MyBookingView:
    properties:
      createdAt:
        type: string
      date:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      quantities:
        $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.Quantities'
      routeName:
        type: string
      status:
        type: string
      time:
        type: string
      totalAmount:
        type: number
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.MyBookingsResponse:
    properties:
      bookings:
        items:
          $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.MyBookingView'
        type: array
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.Quantities:
    properties:
      big:
        type: integer
      child:
        type: integer
      medium:
        type: integer
      small:
        type: integer
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.QuantitiesRequest:
    properties:
      big:
        type: integer
      child:
        type: integer
      medium:
        type: integer
      small:
        type: integer
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.SlotForDate:
    properties:
      availableBig:
        type: integer
      availableMedium:
        type: integer
      availableSmall:
        type: integer
      blocked:
        type: boolean
      routeName:
        type: string
      time:
        type: string
      totalBig:
        type: integer
      totalMedium:
        type: integer
      totalSmall:
        type: integer
    type: object
  github_com_harbour-wave_harbour-wave-backend_internal_model.SlotsForDateResponse:
    properties:
      bookingsEnabled:
        type: boolean
      date:
        type: string
      dateBlocked:
        type: boolean
      fullyBlocked:
        type: boolean
      slots:
        items:
          $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.SlotForDate'
        type: array
    type: object
  github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody:
    properties:
      detail:
        type: string
      issues:
        items:
          $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.Issue'
        type: array
      message:
        type: string
    type: object
  github_com_harbour-wave_harbour-wave-backend_pkg_httpx.Issue:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
info:
  contact: {}
  description: Boat reservation backend
  title: Harbour & Wave API
  version: "1.0"
paths:
  /admin/bookings/{bookingId}/cancel:
    post:
      consumes:
      - application/json
      description: Admin endpoint to force cancel a booking.
      parameters:
      - description: Booking ID (UUID)
        in: path
        name: bookingId
        required: true
        type: string
      - description: Cancellation reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminCancelBookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminCancelBookingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Cancel a booking
      tags:
      - admin
  /admin/bookings/{bookingId}/price:
    patch:
      consumes:
      - application/json
      description: Admin endpoint to manually override the price of a booking.
      parameters:
      - description: Booking ID (UUID)
        in: path
        name: bookingId
        required: true
        type: string
      - description: Override details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminPriceOverrideRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminPriceOverrideResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Override booking price
      tags:
      - admin
  /admin/dates/{date}/block:
    delete:
      description: Admin endpoint to remove a block on an entire date.
      parameters:
      - description: Date in YYYY-MM-DD format
        in: path
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminUnblockDateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Unblock an entire date
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Admin endpoint to block bookings for an entire date.
      parameters:
      - description: Date in YYYY-MM-DD format
        in: path
        name: date
        required: true
        type: string
      - description: Block reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminBlockDateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminBlockDateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Block an entire date
      tags:
      - admin
  /admin/slots/{date}/{time}/{route}:
    put:
      consumes:
      - application/json
      description: Admin endpoint to create a slot for a given date/time/route or
        update its capacities.
      parameters:
      - description: Date in YYYY-MM-DD format
        in: path
        name: date
        required: true
        type: string
      - description: Time in HH:MM format
        in: path
        name: time
        required: true
        type: string
      - description: Route name
        in: path
        name: route
        required: true
        type: string
      - description: Capacity payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminUpsertSlotRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminUpsertSlotResponse'
        "400":
          description: INVALID_DATE, INVALID_TIME, INVALID_ROUTE, or INVALID_INPUT
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create or update a slot
      tags:
      - admin
  /admin/slots/{date}/{time}/{route}/block:
    delete:
      description: Admin endpoint to remove a block on a specific date, time, and
        route.
      parameters:
      - description: Date in YYYY-MM-DD format
        in: path
        name: date
        required: true
        type: string
      - description: Time in HH:MM format
        in: path
        name: time
        required: true
        type: string
      - description: Route name
        in: path
        name: route
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminUnblockSlotResponse'
        "400":
          description: INVALID_DATE, INVALID_TIME, or INVALID_ROUTE
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Unblock a specific slot
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Admin endpoint to block bookings for a specific date, time, and
        route.
      parameters:
      - description: Date in YYYY-MM-DD format
        in: path
        name: date
        required: true
        type: string
      - description: Time in HH:MM format
        in: path
        name: time
        required: true
        type: string
      - description: Route name
        in: path
        name: route
        required: true
        type: string
      - description: Block reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminBlockSlotRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminBlockSlotResponse'
        "400":
          description: INVALID_DATE, INVALID_TIME, or INVALID_ROUTE
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Block a specific slot
      tags:
      - admin
  /admin/slots/{date}/{time}/{route}/bookings:
    get:
      description: Admin endpoint returning all bookings (any status) for a specific
        date/time/route slot.
      parameters:
      - description: Date in YYYY-MM-DD format
        in: path
        name: date
        required: true
        type: string
      - description: Time in HH:MM format
        in: path
        name: time
        required: true
        type: string
      - description: Route name
        in: path
        name: route
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminSlotBookingsResponse'
        "400":
          description: INVALID_DATE, INVALID_TIME, or INVALID_ROUTE
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: List bookings for a slot
      tags:
      - admin
  /admin/system/bookings-enabled:
    put:
      consumes:
      - application/json
      description: Admin endpoint to enable or disable the creation of all new bookings.
      parameters:
      - description: Kill-switch payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminSetBookingsEnabledRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AdminSetBookingsEnabledResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_pkg_httpx.ErrorBody'
      security:
      - BearerAuth: []
      summary: Toggle global booking kill-switch
      tags:
      - admin
  /availability/{month}:
    get:
      description: Returns daily availability for a given month
      parameters:
      - description: Month in YYYY-MM format
        in: path
        name: month
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_harbour-wave_harbour-wave-backend_internal_model.AvailabilityMonthResponse'
